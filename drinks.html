<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 마시지? | 프리미엄 음료 추천</title>
    <link rel="stylesheet" href="drinkStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-color: #74b9ff; }
        h1 { color: #2d3436; text-align: center; }
        .filter-btn.active { background-color: var(--main-color) !important; border-color: var(--main-color) !important; }
        #spin-btn { background-color: #0984e3; }
        
        /* 새로운 결과 표시 스타일: 모달을 대체함 */
        #result-display {
            margin-top: 20px;
            padding: 20px;
            text-align: center;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none; /* 결과가 나올 때만 보임 */
            border: 3px solid var(--main-color);
        }
        #result-name { font-size: 1.8rem; font-weight: bold; color: #0984e3; margin-bottom: 10px; }
        .celebration { font-size: 1.2rem; color: #636e72; }
    </style>
</head>
<body>
    <div class="container">
        <h1>오늘 뭐 마시지? 🥤</h1>
        
        <div class="filter-section">
            <p class="filter-guide">※ 버튼을 클릭하여 음료 종류를 중복 선택할 수 있습니다.</p>
            <div class="tabs category-tabs">
                <button class="filter-btn active" onclick="toggleFilter('cat', 'all', this)">전체</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'coffee', this)">커피</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'tea', this)">티/차</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'ade', this)">에이드</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'smoothie', this)">스무디</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'juice', this)">주스</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'alcohol', this)">주류</button>
            </div>
            <div class="tabs type-tabs">
                <button class="filter-btn active" onclick="toggleFilter('type', 'all', this)">전체</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'ice', this)">ICE</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'hot', this)">HOT</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'etc', this)">기타</button>
            </div>
        </div>

        <div class="main-content">
            <div class="roulette-wrapper">
                <div class="arrow"></div>
                <div class="canvas-container">
                    <canvas id="rouletteCanvas" width="400" height="400"></canvas>
                    <button id="spin-btn" onclick="spinRoulette()">SPIN</button>
                </div>
                
                <!-- 결과 모달 대신 나타날 영역 -->
                <div id="result-display">
                    <div class="celebration">✨ 오늘의 추천 음료 ✨</div>
                    <div id="result-name">메뉴 이름</div>
                    <button class="filter-btn" onclick="this.parentElement.style.display='none'">다시 뽑기</button>
                </div>
            </div>
            
            <div class="list-container">
                <div class="list-header">
                    <h3>후보 음료 (<span id="menu-count">0</span>)</h3>
                    <div class="add-menu-box">
                        <input type="text" id="add-input" placeholder="새 음료 이름">
                        <button onclick="addNewMenu()">+</button>
                    </div>
                </div>
                <ul id="menu-list"></ul>
            </div>
        </div>
    </div>

    <script src="drinkData.js"></script>
    <script src="drinkScript.js"></script>
    <script>
        // 기존 drinkScript.js에서 모달을 띄우는 함수(showResult 등)가 있다면
        // 아래 코드를 참고하여 그 함수 내부를 수정해야 합니다.
        function displayFinalResult(selectedMenu) {
            const display = document.getElementById('result-display');
            const nameField = document.getElementById('result-name');
            
            display.style.display = 'block';
            nameField.innerText = selectedMenu;
            
            // 화면이 자동으로 결과창으로 스크롤되게 함
            display.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
