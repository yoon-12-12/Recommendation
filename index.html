<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 프리미엄 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>오늘 뭐 먹지? 🍱</h1>
        
        <!-- 필터 섹션: 중복 선택 및 추가 카테고리 포함 -->
        <div class="filter-section">
            <p class="filter-guide">※ 버튼을 클릭하여 메뉴를 중복 선택할 수 있습니다.</p>
            <div class="tabs category-tabs">
                <button class="filter-btn active" onclick="toggleFilter('cat', 'all', this)">전체</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'korean', this)">한식</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'japanese', this)">일식</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'chinese', this)">중식</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'western', this)">양식</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'snack', this)">분식</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'night', this)">야식</button>
                <button class="filter-btn" onclick="toggleFilter('cat', 'dessert', this)">디저트</button>
            </div>
            <div class="tabs type-tabs">
                <button class="filter-btn active" onclick="toggleFilter('type', 'all', this)">전체</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'rice', this)">밥</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'noodle', this)">면</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'soup', this)">국물</button>
                <button class="filter-btn" onclick="toggleFilter('type', 'etc', this)">기타</button>
            </div>
        </div>

        <div class="main-content">
            <!-- 룰렛 영역 -->
            <div class="roulette-wrapper">
                <div class="arrow"></div>
                <div class="canvas-container">
                    <canvas id="rouletteCanvas" width="400" height="400"></canvas>
                    <button id="spin-btn" onclick="spinRoulette()">SPIN</button>
                </div>
            </div>
            
            <!-- 리스트 컨테이너 -->
            <div class="list-container">
                <div class="list-header">
                    <h3>후보 메뉴 (<span id="menu-count">0</span>)</h3>
                    <div class="add-menu-box">
                        <input type="text" id="add-input" placeholder="새 메뉴 이름">
                        <button onclick="addNewMenu()">+</button>
                    </div>
                </div>
                <ul id="menu-list"></ul>
            </div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalFoodName">오늘의 추천 메뉴</h2>
            <div id="imageBox" class="image-box">
                <img id="foodImage" src="" alt="음식 사진" style="display: none;">
                <p id="loaderText">이미지 불러오는 중...</p>
            </div>
            <button id="search-more-btn" class="search-btn">🔍 네이버 이미지 검색</button>
            <button class="confirm-btn" onclick="closeModal()">결정!</button>
        </div>
    </div>

    <!-- 데이터와 로직 스크립트 -->
    <script src="menuData.js"></script>
    <script src="script.js"></script>
</body>
</html>
